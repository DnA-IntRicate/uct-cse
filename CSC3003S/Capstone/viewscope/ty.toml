# Ty static type checker configuration file.
# See: https://docs.astral.sh/ty/configuration/.

[src]
include = [
    "src/viewscope",
    "tests/"
]
exclude = ["src/viewscope_core"]

# See: https://docs.astral.sh/ty/reference/rules/.
[rules]
deprecated = "error"
experimental-syntax = "error"
invalid-legacy-positional-parameter = "error"
