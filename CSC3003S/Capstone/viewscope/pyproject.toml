[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/viewscope",
    "src/viewscope_core",
]

[project]
name = "viewscope"
version = "0.0.1"
description = "CSC3003S-2026 Capstone project."
readme = "README.md"
authors = [
    { name = "Azaam Holdman" },
    { name = "Kira Webb" },
    { name = "Adam Foflonker" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
    "pillow>=12.3.0",
    "pyqt6>=6.11.0",
    "pyrender>=0.1.45",
    "pyside6==6.9.3",
    "rtree>=1.4.1",
    "scipy>=1.16",
    "trimesh>=5.0.0",
    "vtk>=9.6.2",
]

[project.scripts]
viewscope = "viewscope.main:main"
viewscope-build = "viewscope.build_bundle:main"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/__init__.py",
    "src/viewscope_core/*",
    # The bundle-building CLI: a separate entry point, not part of the app.
    "src/viewscope/build_bundle.py",
    # These need a live OpenGL context: both bind a QVTKRenderWindowInteractor,
    # and MainWindow constructs one of each in __init__, so none of the three
    # can be built without a display.
    "src/viewscope/viewport.py",
    "src/viewscope/CameraViewport.py",
    "src/viewscope/window.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    # Only runs when a module is executed as a script, never under pytest.
    "if __name__ == .__main__.:",
]

# Fails pytest if the total coverage falls below this percentage
fail_under = 90
