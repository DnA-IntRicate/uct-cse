name: Python Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["master", "main"]
    paths:
      - "**.py"
      - ".ruff.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-test.yml"

  push:
    branches: ["master", "main"]
    paths:
      - "**.py"
      - ".ruff.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

permissions:
  contents: write
  statuses: write

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          python-version: "3.14"
          working-directory: "."
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libosmesa6 \
            libegl1 \
            libegl-mesa0 \
            freeglut3-dev

      - name: Install deps
        run: uv sync --all-groups

        # NOTE: Our graphical application requires a virtual framebuffer to run in headless mode.
        # We use xvfb-run to start a virtual X server for the tests.
      - name: Run PyTest
        env:
          PYRENDER_PLATFORM: osmesa
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" uv run pytest
